<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2447">
  <meta name="referrer" content="no-referrer">
  <title>MeetNote · คลังประชุม</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f8;font:14px/1.4 Tahoma,sans-serif}body{display:flex;flex-direction:column;height:100dvh}header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));background:#0b2447;color:#fff}header strong{color:#e4c55c;white-space:nowrap}header a{color:#fff;text-underline-offset:3px;min-height:30px;display:flex;align-items:center;font-size:12px}a:focus-visible{outline:3px solid #e4c55c;outline-offset:2px}iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#eef2f8}#wait{position:fixed;inset:42px 0 0;display:grid;place-items:center;background:#eef2f8;pointer-events:none}#wait div{text-align:center;padding:20px;color:#12263f}#wait[hidden]{display:none}.spinner{width:32px;height:32px;margin:0 auto 14px;border:3px solid #cbd5e1;border-top-color:#c9a227;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-height:500px){header{min-height:36px;padding-top:3px;padding-bottom:3px}#wait{top:36px}}
  </style>
</head>
<body>
  <header><strong>MeetNote</strong><a id="direct" target="_blank" rel="noopener noreferrer">เปิดตรง / เข้าสู่ระบบ Google ↗</a></header>
  <iframe id="app" title="MeetNote คลังประชุมส่วนตัว" allow="microphone; camera; fullscreen"></iframe>
  <div id="wait" role="status" aria-live="polite"><div><div class="spinner" aria-hidden="true"></div>กำลังเปิดคลังประชุม…<p>หากหน้าไม่แสดง ให้ใช้ “เปิดตรง / เข้าสู่ระบบ Google” ด้านบน</p></div></div>
  <noscript>กรุณาเปิด JavaScript เพื่อใช้งาน MeetNote</noscript>
  <script>
    'use strict';
    const APP_URL = 'https://script.google.com/macros/s/AKfycbw5NlWy-def0388NczZYPFkcszHm0tvx7nGmPVE7i-XvV6NlVcthxS1DKb27FHBARQy7Q/exec';
    const app = document.getElementById('app');
    const wait = document.getElementById('wait');
    document.getElementById('direct').href = APP_URL;
    // load signals iframe navigation only; the Google owner gate stays inside it.
    app.addEventListener('load', () => { wait.hidden = true; });
    app.src = APP_URL;
  </script>
</body>
</html>
